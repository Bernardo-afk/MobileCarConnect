// Compose stability configuration (docs/LOW_END_PERFORMANCE.md, round 2).
//
// :mobilecarconnect-core is built without the Compose compiler, so its value classes count as unstable and
// strong skipping compares them by identity: a new but equal LinkState from the session layer
// recomposed every part of Home that shows it. These are immutable data classes (vals of strings,
// numbers, enums and each other), so equality is safe. Collections are read-only Kotlin
// interfaces that MobileCarConnect never mutates after handing them to the UI.
com.mobilecarconnect.core.core.LinkState
com.mobilecarconnect.core.core.LinkNotice
com.mobilecarconnect.core.detect.PairedPhone
com.mobilecarconnect.core.connection.PhoneHealth
com.mobilecarconnect.core.connection.PathHealth
com.mobilecarconnect.core.connection.ProblemRecord
kotlin.collections.List
kotlin.collections.Set
kotlin.collections.Map
